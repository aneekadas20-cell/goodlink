# Server Configuration (Defaults to 8081 if 8080 is in use, configurable via SERVER_PORT or PORT)
server.port=${SERVER_PORT:${PORT:8081}}

# Application Details
spring.application.name=GoodLink

# Telegram Bot Configuration
# Bot token is read from environment variable TELEGRAM_BOT_TOKEN
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:GoodLinkBot}

# Spring Mail (Gmail SMTP)
# Reads MAIL_USER and MAIL_PASS from environment variables
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Platform Admin Email for notifications
goodlink.admin.email=admin@goodlink.ngo

# Optional NGO Email Override for testing/redirection
ngo.email.override=${NGO_EMAIL_OVERRIDE:}

# Logging
logging.level.com.goodlink=INFO
logging.level.org.springframework.web=INFO
